name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  go-tests:
    name: Go tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run Go tests
        run: go test ./...

      - name: Check verification script syntax
        run: bash -n scripts/verify.sh

      - name: Lint OpenAPI specification
        run: |
          docker run --rm \
            -v "$PWD:/spec" \
            redocly/cli:latest \
            lint /spec/docs/openapi.yaml

      - name: Check Docker Compose config
        run: docker compose config --quiet
