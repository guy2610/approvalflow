apiVersion: apps/v1
kind: Deployment
metadata:
  name: submission-service
  namespace: approvalflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: submission-service
  template:
    metadata:
      labels:
        app: submission-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "submission-service"
        dapr.io/app-port: "8080"
    spec:
      containers:
        - name: submission-service
          image: approvalflow/submission-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: DAPR_HTTP_PORT
              value: "3500"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: submission-service
  namespace: approvalflow
spec:
  selector:
    app: submission-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
