apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: approvalflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "gateway-service"
        dapr.io/app-port: "8080"
    spec:
      containers:
        - name: gateway-service
          image: approvalflow/gateway-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: RATE_LIMIT_REQUESTS_PER_MINUTE
              value: "120"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: approvalflow
spec:
  type: LoadBalancer
  selector:
    app: gateway-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
