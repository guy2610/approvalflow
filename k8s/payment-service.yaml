apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: approvalflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "payment-service"
        dapr.io/app-port: "8080"
    spec:
      containers:
        - name: payment-service
          image: approvalflow/payment-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: DAPR_HTTP_PORT
              value: "3500"
            - name: DAPR_SECRET_STORE_NAME
              value: kubernetes
            - name: PAYMENT_PROVIDER_TOKEN_SECRET_NAME
              value: payment-provider-token
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: approvalflow
spec:
  selector:
    app: payment-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
