apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-service
  namespace: approvalflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-service
  template:
    metadata:
      labels:
        app: agent-service
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "agent-service"
        dapr.io/app-port: "8080"
    spec:
      containers:
        - name: agent-service
          image: approvalflow/agent-service:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: AGENT_PROVIDER
              value: local
            - name: GEMINI_MODEL
              value: gemini-2.5-flash
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: approvalflow-secrets
                  key: gemini-api-key
                  optional: true
            - name: AGENT_LLM_TIMEOUT_SECONDS
              value: "8"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: agent-service
  namespace: approvalflow
spec:
  selector:
    app: agent-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
