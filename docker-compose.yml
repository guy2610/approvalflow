services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: approvalflow
      POSTGRES_PASSWORD: approvalflow
      POSTGRES_DB: approvalflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U approvalflow -d approvalflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  gateway-service:
    build:
      context: .
      dockerfile: services/Dockerfile.go-service
      args:
        SERVICE: gateway-service
    environment:
      PORT: 8080
    ports:
      - "8080:8080"

  gateway-service-dapr:
    image: daprio/daprd:1.14.4
    command:
      [
        "./daprd",
        "--app-id", "gateway-service",
        "--app-port", "8080",
        "--dapr-http-port", "3500",
        "--resources-path", "/components"
      ]
    volumes:
      - ./infra/dapr/components:/components
    depends_on:
      - gateway-service
      - redis
      - postgres
    network_mode: "service:gateway-service"

  submission-service:
