services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: approvalflow
      POSTGRES_PASSWORD: approvalflow
      POSTGRES_DB: approvalflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U approvalflow -d approvalflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine

  gateway-service:
    build:
      context: .
      dockerfile: services/Dockerfile.go-service
      args:
        SERVICE: gateway-service
    environment:
      PORT: 8080
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-120}
    ports:
      - "8080:8080"

  gateway-service-dapr:
    image: daprio/daprd:1.14.4
    command:
      [
        "./daprd",
        "--app-id", "gateway-service",
        "--app-port", "8080",
        "--dapr-http-port", "3500",
        "--resources-path", "/components"
      ]
    volumes:
      - ./infra/dapr/components:/components
      - ./infra/dapr/secrets:/secrets
    restart: on-failure:5
    depends_on:
      gateway-service:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    network_mode: "service:gateway-service"

  submission-service:
